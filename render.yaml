# Render Blueprint: serves the prebuilt ./dist as a static site. Copied into the deploy folder by
# make-deploy-dir.mjs; that folder (not this repository) is what gets pushed to Render.
services:
  - type: web
    runtime: static
    name: shieldpost
    buildCommand: echo "dist is prebuilt"
    staticPublishPath: ./dist
    # The wallet uses threads (SharedArrayBuffer), which needs a cross-origin-isolated page
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-origin
